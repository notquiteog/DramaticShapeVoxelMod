name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests
  cancel-in-progress: true

jobs:
  lua-suite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LuaJIT
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y luajit

      - name: Fetch the pinned engine test harness (no ROM required)
        uses: actions/checkout@v4
        with:
          repository: bryanthaboi/gen1recomp
          ref: v0.3.51
          path: .test-engine

      - name: Run the Lua suite
        env:
          TEST_LOG_DIR: test-results
        run: bash tools/run_tests.sh "$PWD/.test-engine"

      - name: Save test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lua-suite-logs
          path: test-results

      - name: Compile every production module
        run: |
          set -euo pipefail
          fail=0
          for f in lib/*.lua lib/*/*.lua main.lua; do
            [ -f "$f" ] || continue
            if ! luajit -bl "$f" /dev/null >/dev/null 2>&1; then
              echo "::error file=$f::does not compile under LuaJIT"
              fail=1
            fi
          done
          exit "$fail"

      - name: Whitespace
        run: git diff --check

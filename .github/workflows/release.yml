name: Release

# A versioned main snapshot publishes once. An existing tag means the reviewed
# release is being managed by its publisher; never invent another version.
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check version
        id: version
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import json, re, subprocess
          version = json.load(open('manifest.json'))['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), 'Invalid manifest version'
          tag = 'v' + version
          tagged = subprocess.run(['git', 'rev-parse', '--verify', '--quiet', 'refs/tags/' + tag], stdout=subprocess.DEVNULL).returncode == 0
          print('tag=' + tag)
          print('publish=' + ('false' if tagged else 'true'))
          PYTHON
      - name: Build portable mod
        if: steps.version.outputs.publish == 'true'
        run: python3 tools/package_release.py --output dist
      - name: Publish
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes dist/*.zip dist/sha256sums.txt
